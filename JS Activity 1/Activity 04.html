    <body>
        <h1>Defining functions in JS</h1>
        <p>Open the developer preview to see the console output.</p>
        <script>
            function greetuser(name){
                console.log("Hello "  + name + ", Welcome to my Website")
            }
            function addnumbers(num1, num2){
                console.log("The sum is: " + (num1 + num2));
            }

            greetuser("Humaidh");
            addnumbers(5, 10);
        </script>
    </body>
